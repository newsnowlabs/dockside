/var/log/dockside/*.log {
	size 1M
	rotate 10

	missingok

	# Ownership is stated rather than inherited. These files are written by processes running as
	# different users - nginx's master is root, app-server and docker-event-daemon run as
	# dockside - and a plain append creates the file if it is absent, so after a rotation
	# whichever process writes first would otherwise decide the owner. A root-created file is
	# unwritable by every other Dockside process for the rest of its life. dockside, not root,
	# because root can append to a dockside-owned file but not the reverse.
	create 0644 dockside dockside

	compress

	notifempty

	sharedscripts
}
