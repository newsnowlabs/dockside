# Minimal example: one network, a small egress allowlist (DNS + HTTP/HTTPS
# only) for devtainer traffic. Demonstrates the firewall daemon working with
# the least possible moving parts — see ../multi-network-production/ for a
# real multi-network deployment, or ../ai-dev-sandbox/ for restricting a
# single workspace network to an AI-coding-tool allowlist.
#
# The dockside service's mac_address matches network-config.json's
# dockside_mac — required so the firewall daemon's ING chain still lets the
# dockside container open new connections to devtainers on this network to
# reverse-proxy to them; without it, ALL new same-network connections are
# dropped, dockside's own included. dockside_egress is left at its default
# ("exempt"), so the rules below end up governing devtainer egress only, not
# dockside's own. See network-config.json's comment.
#
# Before starting: copy network-config.json and firewall-config.json from this
# directory to ~/.dockside/network-firewall/ (or point the network-firewall
# service's volume mount below at wherever you keep them).
#
# Start order matters: the firewall daemon creates the "dockside" network
# below before the dockside container can attach to it.
#   docker compose up -d network-firewall && sleep 2 && docker compose up -d dockside

services:
  dockside:
    container_name: ${DOCKSIDE_NAME:-dockside}
    image: ${DOCKSIDE_IMAGE:-newsnowlabs/dockside:latest}
    restart: unless-stopped
    attach: true
    command: ["--ssl-builtin"]
    ports:
      - "${DOCKSIDE_HTTPS_PORT:-443}:443"
      - "${DOCKSIDE_HTTP_PORT:-80}:80"
      - "1053:53/udp"
    volumes:
      - ~/.dockside:/data
      - /var/run/docker.sock:/var/run/docker.sock
      - dockside-ide:/opt/dockside
      - dockside-hostdata:/opt/dockside/host
    security_opt:
      - apparmor:unconfined
    networks:
      dockside:
        mac_address: "02:00:00:00:00:02"

  network-firewall:
    container_name: ${DOCKSIDE_NAME:-dockside}-network-firewall
    image: ${DOCKSIDE_NETWORK_FIREWALL_IMAGE:-newsnowlabs/dockside-network-firewall:latest}
    pid: "host"
    privileged: true
    network_mode: "none"          # No network of its own — uses nsenter to enter host netns
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ~/.dockside/network-firewall:/etc/dockside
    entrypoint:
      - nsenter
      - --net=/proc/1/ns/net
      - --
      - python3
      - /usr/local/lib/dockside/dockside-network-firewall.py
      - --daemon

volumes:
  dockside-ide:
  dockside-hostdata:

networks:
  dockside:
    external: true
