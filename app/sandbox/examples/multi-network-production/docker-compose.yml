# Real multi-network deployment: dockside itself sits on all four networks
# (mac_address pins it to the dockside_mac each network expects). Every
# network leaves dockside_egress at its default ("exempt"), so dockside's own
# traffic is exempted from the per-network egress rules — see
# network-config.json/firewall-config.json. ds-prod additionally pins a
# static ipv4_address, since its firewall config uses dockside_ip as well as
# dockside_mac. See ../minimal/ or ../ai-dev-sandbox/ for simpler starting points.
#
# Before starting: copy network-config.json and firewall-config.json from this
# directory to ~/.dockside/network-firewall/ (or point the network-firewall
# service's volume mount below at wherever you keep them).
#
# Start order matters: the firewall daemon creates the networks below before
# the dockside container can attach to them.
#   docker compose up -d network-firewall && sleep 2 && docker compose up -d dockside

services:
  dockside:
    container_name: ${DOCKSIDE_NAME:-dockside}
    image: ${DOCKSIDE_IMAGE:-newsnowlabs/dockside:latest}
    restart: unless-stopped
    attach: true
    command: ["--ssl-builtin"]
    ports:
      - "${DOCKSIDE_HTTPS_PORT:-443}:443"
      - "${DOCKSIDE_HTTP_PORT:-80}:80"
      - "1053:53/udp"
    volumes:
      - ~/.dockside:/data
      - /var/run/docker.sock:/var/run/docker.sock
      - dockside-ide:/opt/dockside
      - dockside-hostdata:/opt/dockside/host
    security_opt:
      - apparmor:unconfined
    networks:
      dockside:
        mac_address: "02:00:00:00:00:02"
        gw_priority: 1000
      ds-priv:
        mac_address: "02:00:00:00:00:02"
        gw_priority: 100
      ds-clone:
        mac_address: "02:00:00:00:00:02"
        gw_priority: 101
      ds-prod:
        mac_address: "02:00:00:00:00:02"
        ipv4_address: 172.20.3.2
        gw_priority: 102

  network-firewall:
    container_name: ${DOCKSIDE_NAME:-dockside}-network-firewall
    image: ${DOCKSIDE_NETWORK_FIREWALL_IMAGE:-newsnowlabs/dockside-network-firewall:latest}
    pid: "host"
    privileged: true
    network_mode: "none"          # No network of its own — uses nsenter to enter host netns
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ~/.dockside/network-firewall:/etc/dockside
    entrypoint:
      - nsenter
      - --net=/proc/1/ns/net
      - --
      - python3
      - /usr/local/lib/dockside/dockside-network-firewall.py
      - --daemon

volumes:
  dockside-ide:
  dockside-hostdata:

networks:
  dockside:
    external: true
  ds-priv:
    external: true
  ds-prod:
    external: true
  ds-clone:
    external: true
